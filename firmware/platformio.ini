; MoonPixel - moon lamp firmware
; Board: ESP32-C3 SuperMini (uses the generic ESP32-C3 DevKitM-1 definition)
; LEDs:  WS2812 5050 (RGB, GRB order) 2x2 panel = 4 LEDs, driven by our own SPI+DMA driver
;
; Build + flash:   pio run -t upload
; Serial monitor:  pio device monitor
;
; The panel is plain WS2812 RGB, GRB order (confirmed by test). LED type is a saved setting on the lamp's page.

[env:esp32c3_supermini]
; Pinned so every build uses the same Arduino core (2.0.17).
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino

extra_scripts =
    pre:tools/gen_web.py
    pre:tools/gen_icons.py

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; The SuperMini has no USB-UART chip: serial runs over the C3's native USB.
; These two flags make Serial print over that USB port.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=0

; Bluetooth LE (NimBLE is far smaller than the stock Arduino BLE library)
lib_deps =
    h2zero/NimBLE-Arduino@1.4.2
